services:
  - type: web
    name: kres-admin
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn storefront.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,krescoadmin.xyz,www.krescoadmin.xyz"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://krescoadmin.xyz,https://www.krescoadmin.xyz"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Start conservatively; increase after confirming every production hostname is HTTPS-only.
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_EMPLOYEE_PHOTOS_BUCKET
        value: "employee-profile-photos"
      - key: MONTHLY_CLEANUP_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"
      # AWS S3 Configuration (add these in Render dashboard)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: "kres-admin-photos"
      - key: AWS_S3_REGION_NAME
        value: "us-east-1"
